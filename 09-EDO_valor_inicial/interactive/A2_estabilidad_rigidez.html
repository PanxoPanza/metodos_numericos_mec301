<meta charset="utf-8">
<style>
#est-app{width:100%;max-width:min(800px,94vw);padding:4px 2px;background:transparent;
  font-family:"Segoe UI",Calibri,system-ui,sans-serif;font-size:15px;line-height:1.45;
  --tinta:#1a2733;--suave:#5d6b78;--linea:#d8dee4;--panel:#f6f8fa;
  --c1:#1f77b4;--c2:#ff7f0e;--rojo:#d62728;--acento:#00afd8;--verde:#1c7a3e;color:var(--tinta)}
html[data-theme="dark"] #est-app,
body[data-jp-theme-light="false"] #est-app{--tinta:#ccd6e0;--suave:#9fb0be}
@media (prefers-color-scheme:dark){
  html[data-theme="auto"] #est-app{--tinta:#ccd6e0;--suave:#9fb0be}
}
#est-app *{box-sizing:border-box}
#est-app .est-wrap{display:flex;gap:1.05em;align-items:flex-start;flex-wrap:wrap}
#est-app .est-izq{flex:3 1 264px;min-width:0;max-width:448px}
#est-app .est-der{flex:2 1 250px;min-width:0;font-size:0.85em}
#est-app svg{width:100%;height:auto;display:block;background:#fff;
  border:1px solid var(--linea);border-radius:0.55em;touch-action:none;margin-bottom:0.35em}
#est-app .est-ctrl{margin:0.5em 0}
#est-app .est-ctrl label{display:block;font-size:0.9em;color:var(--suave);margin-bottom:0.12em}
#est-app .est-val{color:var(--acento);font-weight:600}
#est-app input[type=range]{width:100%;margin:0;accent-color:var(--acento)}
#est-app .est-chk{font-size:0.9em;color:var(--tinta);display:flex;align-items:center;gap:0.4em;margin:0.3em 0}
#est-app .est-tit{font-size:0.86em;color:var(--suave);margin:0.45em 0 0.1em}
#est-app .est-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:0.3em;margin:0.2em 0 0.35em}
#est-app .est-btns button{font:inherit;font-size:0.82em;padding:0.3em 0.2em;cursor:pointer;
  border:1px solid var(--linea);border-radius:0.4em;background:#fff;color:#1a2733}
#est-app .est-btns button.est-on{background:var(--acento);border-color:var(--acento);color:#fff}
#est-app .est-eqbox{font-family:"Cambria Math",Cambria,Georgia,serif;font-size:1.0em;
  background:var(--panel);color:#1a2733;border:1px solid var(--linea);border-radius:0.4em;
  padding:0.35em 0.5em;margin:0.4em 0;text-align:center}
#est-app table.est-t{width:100%;border-collapse:collapse;margin-top:0.3em;font-size:0.95em}
#est-app table.est-t td{padding:0.15em 0.3em;border-bottom:1px solid rgba(128,140,152,0.25)}
#est-app table.est-t td.est-num{text-align:right;font-variant-numeric:tabular-nums}
#est-app .est-badge{display:inline-block;padding:0.2em 0.6em;border-radius:1em;
  font-size:0.85em;font-weight:600;margin-top:0.45em}
#est-app .est-ok{background:#e3f4e8;color:#1c7a3e}
#est-app .est-amb{background:#fdf3dd;color:#8a6100}
#est-app .est-bad{background:#fbe4e4;color:#a11}
#est-app .est-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:0.3em 0.9em;
  margin-top:0.2em;font-size:0.84em;color:var(--tinta)}
#est-app .est-leg > span{display:inline-flex;align-items:center;gap:0.42em;white-space:nowrap}
#est-app .est-sw{display:inline-block;width:2.2em;height:0}
#est-app .est-pt{display:inline-block;width:0.8em;height:0.8em;border-radius:50%;
  border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(128,140,152,0.55)}
#est-app .est-sq{display:inline-block;width:1.1em;height:0.8em;border:1px solid rgba(128,140,152,0.55)}
#est-app .est-ley{font-size:0.82em;color:var(--suave);margin-top:0.3em;text-align:center}
</style>

<div id="est-app">
  <div class="est-wrap">
    <div class="est-izq">
      <svg id="est-s" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid meet" style="cursor:crosshair"></svg>
      <div class="est-leg" id="est-leg"></div>
      <div class="est-ley">Arrastremos sobre el gráfico para hacer zoom en una región. dy/dt = −1000y + 3000 − 2000e<sup>−t</sup>, y(0) = 0</div>
    </div>
    <div class="est-der">
      <div class="est-ctrl">
        <label>paso h = <span class="est-val" id="est-hv"></span></label>
        <input type="range" id="est-h" min="-3.3" max="-0.7" step="0.01" value="-1.3">
      </div>
      <div class="est-btns">
        <button id="est-p1">h = 0.0015</button>
        <button id="est-p2">h = 0.05</button>
        <button id="est-zt">ver transitorio</button>
        <button id="est-zr">restablecer vista</button>
      </div>
      <div class="est-eqbox" id="est-info"></div>
      <div class="est-tit">métodos (clic para mostrar u ocultar)</div>
      <table class="est-t"><tbody id="est-tb"></tbody></table>
    </div>
  </div>
</div>

<script>
(function(){

  const NS='http://www.w3.org/2000/svg';
  const el=i=>document.getElementById(i);
  function mk(t,at){const e=document.createElementNS(NS,t);for(const k in at){const v=at[k];
    if(v===undefined||(typeof v==='number'&&!isFinite(v))) throw new Error('attr '+k+'='+v);
    e.setAttribute(k,v);}return e;}
  function txt(p,x,y,s,size,fill,anchor){const t=mk('text',{x:x,y:y,'font-size':size,fill:fill||'#5d6b78','text-anchor':anchor||'middle'});t.textContent=s;p.appendChild(t);return t;}
  function ticks(lo,hi,n){const raw=(hi-lo)/n,p10=Math.pow(10,Math.floor(Math.log10(raw)));
    const st=[1,2,5,10].map(q=>q*p10).find(w=>w>=raw);const out=[];
    for(let k=Math.ceil(lo/st-1e-9);k*st<=hi+1e-12;k++) out.push(k*st);
    return {v:out,dec:Math.max(0,-Math.floor(Math.log10(st)+1e-9))};}
  function marco(svg,VB,VH,xl,xh,yl,yh,xlab,ylab,id){
    const esc=VB/Math.max(svg.clientWidth||svg.getBoundingClientRect().width||VB,1);
    const fT=13*esc,fE=15*esc,ml=Math.max(52,3.6*fT),mb=Math.max(42,3.2*fT),mt=12,mr=26;
    const W=VB-ml-mr,H=VH-mt-mb;
    const X=x=>ml+(x-xl)/(xh-xl)*W, Y=y=>mt+(yh-y)/(yh-yl)*H;
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    const cp=mk('clipPath',{id:id}); cp.appendChild(mk('rect',{x:ml,y:mt,width:W,height:H})); svg.appendChild(cp);
    svg.appendChild(mk('rect',{x:ml,y:mt,width:W,height:H,fill:'#fff',stroke:'#d8dee4'}));
    const tx=ticks(xl,xh,5), ty=ticks(yl,yh,5);
    tx.v.forEach(v=>{svg.appendChild(mk('line',{x1:X(v),y1:mt,x2:X(v),y2:mt+H,stroke:'#000','stroke-opacity':0.06}));
      txt(svg,X(v),mt+H+fT*1.25,v.toFixed(tx.dec),fT);});
    ty.v.forEach(v=>{svg.appendChild(mk('line',{x1:ml,y1:Y(v),x2:ml+W,y2:Y(v),stroke:'#000','stroke-opacity':0.06}));
      txt(svg,ml-fT*0.5,Y(v)+fT*0.36,(Math.abs(v)<1e-12?0:v).toFixed(ty.dec),fT,null,'end');});
    txt(svg,ml+W/2,VH-mb*0.16,xlab,fE,'#1a2733');
    const ly=txt(svg,0,0,ylab,fE,'#1a2733'); ly.setAttribute('transform','translate('+(fE*0.95)+','+(mt+H/2)+') rotate(-90)');
    const capa=mk('g',{'clip-path':'url(#'+id+')'}); svg.appendChild(capa);
    return {X:X,Y:Y,capa:capa,fT:fT,ml:ml,mt:mt,W:W,H:H};
  }
  function poly(pts){return pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');}

  const app=el('est-app'), sv=el('est-s'), VB=640, VH=400;
  const TF=4, LAM=-1000, V0={x0:0,x1:TF,y0:-0.5,y1:3.6};
  const F=(t,y)=>LAM*y+3000-2000*Math.exp(-t);
  const yex=t=>3-0.998*Math.exp(LAM*t)-2.002*Math.exp(-t);
  const MET=[
    {k:'eu',nom:'Euler explícito',tipo:'explícito',col:'#ff7f0e',dash:'',on:true},
    {k:'rk',nom:'RK4',tipo:'explícito',col:'#d62728',dash:'',on:true},
    {k:'ei',nom:'Euler implícito',tipo:'implícito',col:'#1c7a3e',dash:'7 4',on:true},
    {k:'bd',nom:'BDF2',tipo:'implícito',col:'#1f77b4',dash:'2 3',on:true}
  ];
  let lgh=-1.3, V=Object.assign({},V0), geo=null, drag=null, res=null;

  el('est-h').addEventListener('input',e=>{lgh=+e.target.value;calc();draw();});
  el('est-p1').onclick=()=>{lgh=Math.log10(0.0015);el('est-h').value=lgh;calc();draw();};
  el('est-p2').onclick=()=>{lgh=Math.log10(0.05);el('est-h').value=lgh;calc();draw();};
  el('est-zt').onclick=()=>{V={x0:0,x1:0.01,y0:-0.5,y1:3.6};draw();};
  el('est-zr').onclick=()=>{V=Object.assign({},V0);draw();};

  // EDO lineal: los métodos implícitos se despejan en forma exacta
  function sim(k,h){
    const N=Math.round(TF/h), t=[0], y=[0]; let exp=false;
    for(let n=0;n<N;n++){
      const tn=t[n], yn=y[n], t1=tn+h; let y1;
      if(k==='eu') y1=yn+h*F(tn,yn);
      else if(k==='rk'){const k1=F(tn,yn),k2=F(tn+h/2,yn+h/2*k1),k3=F(tn+h/2,yn+h/2*k2),k4=F(t1,yn+h*k3);y1=yn+h/6*(k1+2*k2+2*k3+k4);}
      else if(k==='ei' || n===0) y1=(yn+h*(3000-2000*Math.exp(-t1)))/(1-h*LAM);
      else y1=(4*yn-y[n-1]+2*h*(3000-2000*Math.exp(-t1)))/(3-2*h*LAM);
      t.push(t1); y.push(y1);
      if(!isFinite(y1)||Math.abs(y1)>1e4){exp=true;break;}
    }
    return {t:t,y:y,exp:exp};
  }
  function calc(){ const h=Math.pow(10,lgh); res=MET.map(m=>sim(m.k,h)); }

  function draw(){
    const h=Math.pow(10,lgh);
    const g=marco(sv,VB,VH,V.x0,V.x1,V.y0,V.y1,'t','y','est-c1');
    geo=g;
    const cl=v=>Math.max(V.y0-10*(V.y1-V.y0),Math.min(V.y1+10*(V.y1-V.y0),v));
    const P=[]; for(let i=0;i<=500;i++){const t=V.x0+(V.x1-V.x0)*i/500; P.push([g.X(t),g.Y(cl(yex(t)))]);}
    g.capa.appendChild(mk('path',{d:poly(P),fill:'none',stroke:'#1a2733','stroke-width':2.4}));
    MET.forEach((m,j)=>{ if(!m.on) return; const s=res[j], Q=[];
      for(let i=0;i<s.t.length;i++){
        if(s.t[i]<V.x0 && i+1<s.t.length && s.t[i+1]<V.x0) continue;
        Q.push([g.X(s.t[i]),g.Y(cl(s.y[i]))]);
        if(s.t[i]>V.x1) break; }
      if(Q.length<2) return;
      g.capa.appendChild(mk('path',{d:poly(Q),fill:'none',stroke:m.col,'stroke-width':1.9,'stroke-dasharray':m.dash}));
      if(Q.length<=70) Q.forEach(q=>g.capa.appendChild(mk('circle',{cx:q[0],cy:q[1],r:2.8,fill:m.col})));
    });
    el('est-hv').textContent=h<0.01?h.toFixed(4):h.toFixed(3);
    el('est-info').innerHTML='pasos para llegar a t = 4: '+Math.round(TF/h)+
      '<br>el transitorio dura ~0.005 s<br>los explícitos solo son estables con h &lt; 0.0028';
    el('est-leg').innerHTML='<span><i class="est-sw" style="border-top:2.4px solid #1a2733"></i>exacta</span>'+
      MET.filter(m=>m.on).map(m=>'<span><i class="est-sw" style="border-top:2.4px '+(m.dash?'dashed':'solid')+' '+m.col+'"></i>'+m.nom+'</span>').join('');
    el('est-tb').innerHTML='<tr><td></td><td></td><td class="est-num">error en t = 4</td></tr>'+
      MET.map((m,j)=>{const s=res[j];
        const err=s.exp?'—':Math.abs(s.y[s.y.length-1]-yex(s.t[s.t.length-1])).toExponential(1);
        return '<tr data-j="'+j+'" style="cursor:pointer;opacity:'+(m.on?1:0.4)+'">'+
          '<td><label style="cursor:pointer"><input type="checkbox" '+(m.on?'checked':'')+' style="accent-color:'+m.col+'"> '+
          '<span style="color:'+m.col+';font-weight:600">'+m.nom+'</span></label>'+
          '<br><span style="color:var(--suave);font-size:0.9em">'+m.tipo+'</span></td>'+
          '<td><span class="est-badge '+(s.exp?'est-bad':'est-ok')+'" style="margin:0">'+(s.exp?'inestable':'estable')+'</span></td>'+
          '<td class="est-num">'+err+'</td></tr>';}).join('');
    el('est-tb').querySelectorAll('tr[data-j]').forEach(r=>r.onclick=e=>{
      e.preventDefault(); const m=MET[+r.dataset.j]; m.on=!m.on; draw(); });
  }

  // zoom con rectángulo: el puntero usa getBoundingClientRect (clientX viene escalado por el zoom de RISE)
  function aDato(ev){ const r=sv.getBoundingClientRect();
    const xv=(ev.clientX-r.left)/r.width*VB, yv=(ev.clientY-r.top)/r.height*VH;
    return {xv:xv,yv:yv,
      x:V.x0+(xv-geo.ml)/geo.W*(V.x1-V.x0), y:V.y1-(yv-geo.mt)/geo.H*(V.y1-V.y0)}; }
  sv.addEventListener('pointerdown',ev=>{ drag={a:aDato(ev),rect:mk('rect',{x:0,y:0,width:0,height:0,
      fill:'#00afd8','fill-opacity':0.12,stroke:'#00afd8','stroke-width':1})};
    sv.appendChild(drag.rect); sv.setPointerCapture(ev.pointerId); });
  sv.addEventListener('pointermove',ev=>{ if(!drag) return; const b=aDato(ev), a=drag.a;
    drag.rect.setAttribute('x',Math.min(a.xv,b.xv)); drag.rect.setAttribute('y',Math.min(a.yv,b.yv));
    drag.rect.setAttribute('width',Math.abs(b.xv-a.xv)); drag.rect.setAttribute('height',Math.abs(b.yv-a.yv)); });
  sv.addEventListener('pointerup',ev=>{ if(!drag) return; const b=aDato(ev), a=drag.a; drag=null;
    const x0=Math.max(0,Math.min(a.x,b.x)), x1=Math.min(TF,Math.max(a.x,b.x));
    if(Math.abs(b.xv-a.xv)>8 && Math.abs(b.yv-a.yv)>8 && x1-x0>1e-6)
      V={x0:Math.max(0,Math.min(a.x,b.x)),x1:Math.min(TF,Math.max(a.x,b.x)),y0:Math.min(a.y,b.y),y1:Math.max(a.y,b.y)};
    draw(); });
  sv.addEventListener('dblclick',()=>{V=Object.assign({},V0);draw();});

  let prevW=0;
  new ResizeObserver(e=>{const w=e[0].contentRect.width; if(Math.abs(w-prevW)<1) return; prevW=w;
    app.style.fontSize=Math.max(13,Math.min(17,w/50))+'px'; draw();}).observe(app);
  calc(); draw();

})();
</script>
