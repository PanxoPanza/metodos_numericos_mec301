<meta charset="utf-8">
<style>
#reg-app{width:100%;max-width:min(800px,94vw);padding:4px 2px;background:transparent;
  font-family:"Segoe UI",Calibri,system-ui,sans-serif;font-size:15px;line-height:1.45;
  --tinta:#1a2733;--suave:#5d6b78;--linea:#d8dee4;--panel:#f6f8fa;
  --c1:#1f77b4;--c2:#ff7f0e;--rojo:#d62728;--acento:#00afd8;--verde:#1c7a3e;color:var(--tinta)}
#reg-app *{box-sizing:border-box}
#reg-app .reg-wrap{display:flex;gap:1.05em;align-items:flex-start;flex-wrap:wrap}
#reg-app .reg-izq{flex:3 1 264px;min-width:0;max-width:448px}
#reg-app .reg-der{flex:2 1 250px;min-width:0;font-size:0.85em}
#reg-app svg{width:100%;height:auto;display:block;background:#fff;
  border:1px solid var(--linea);border-radius:0.55em}
#reg-app .reg-ctrl{margin:0.5em 0}
#reg-app .reg-ctrl label{display:block;font-size:0.9em;color:var(--suave);margin-bottom:0.12em}
#reg-app .reg-val{color:var(--acento);font-weight:600}
#reg-app input[type=range]{width:100%;margin:0;accent-color:var(--acento)}
#reg-app .reg-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:0.3em;margin:0.35em 0 0.5em}
#reg-app .reg-btns button{font:inherit;font-size:0.8em;padding:0.3em 0.2em;cursor:pointer;
  border:1px solid var(--linea);border-radius:0.4em;background:#fff;color:var(--tinta)}
#reg-app .reg-btns button.reg-on{background:var(--acento);border-color:var(--acento);color:#fff}
#reg-app .reg-run{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0.3em;margin:0.5em 0}
#reg-app .reg-run button{font:inherit;font-size:0.85em;padding:0.35em 0.2em;cursor:pointer;
  border:1px solid var(--acento);border-radius:0.4em;background:var(--acento);color:#fff;font-weight:600}
#reg-app .reg-run button.reg-sec{background:#fff;color:var(--tinta);border-color:var(--linea);font-weight:400}
#reg-app table.reg-t{width:100%;border-collapse:collapse;margin-top:0.35em}
#reg-app table.reg-t td{padding:0.2em 0.3em;border-bottom:1px solid var(--linea)}
#reg-app table.reg-t td.reg-num{text-align:right;font-variant-numeric:tabular-nums}
#reg-app .reg-badge{display:inline-block;padding:0.2em 0.6em;border-radius:1em;
  font-size:0.85em;font-weight:600;margin-top:0.45em}
#reg-app .reg-ok{background:#e3f4e8;color:var(--verde)}
#reg-app .reg-bad{background:#fbe4e4;color:#a11}
#reg-app .reg-warn{background:#fdf3dd;color:#8a6100}
#reg-app .reg-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:0.3em 0.95em;
  margin-top:0.5em;font-size:0.84em;color:var(--tinta)}
#reg-app .reg-leg span{display:inline-flex;align-items:center;gap:0.42em;white-space:nowrap}
#reg-app .reg-sw{display:inline-block;width:2.2em;height:0}
#reg-app .reg-sw1{border-top:2px dashed var(--c2)}
#reg-app .reg-sw2{border-top:2px dashed var(--c1)}
#reg-app .reg-sw3{border-top:2.5px solid var(--rojo)}
#reg-app .reg-sw4{border-top:2.5px solid var(--tinta)}
#reg-app .reg-ley{font-size:0.82em;color:var(--suave);margin-top:0.35em;text-align:center}
</style>

<div id="reg-app">
  <div class="reg-wrap">
    <div class="reg-izq">
      <svg id="reg-svg" viewBox="0 0 640 520" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="reg-leg">
        <span><i class="reg-sw reg-sw1"></i>región de confianza</span>
        <span><i class="reg-sw reg-sw2"></i>paso de Newton completo</span>
        <span><i class="reg-sw reg-sw3"></i>paso propuesto</span>
        <span><i class="reg-sw reg-sw4"></i>camino aceptado</span>
      </div>
      <div class="reg-ley">Las curvas son niveles de |<b>F</b>|<sup>2</sup>. El punto verde es la raíz.
        Hagamos clic en el gráfico para mover el punto de partida.</div>
    </div>
    <div class="reg-der">
      <div class="reg-btns" id="reg-pres"></div>
      <div class="reg-ctrl">
        <label>radio inicial &nbsp; &Delta;<sub>0</sub> = <span class="reg-val" id="reg-d0v">0.50</span></label>
        <input type="range" id="reg-d0" min="0.1" max="3" step="0.05" value="0.5">
      </div>
      <div class="reg-run">
        <button id="reg-it">iterar</button>
        <button id="reg-it5" class="reg-sec">×5</button>
        <button id="reg-rs" class="reg-sec">reiniciar</button>
      </div>
      <table class="reg-t">
        <tr><td>iteración k</td><td class="reg-num" id="reg-k">0</td></tr>
        <tr><td>radio &Delta;</td><td class="reg-num" id="reg-d">–</td></tr>
        <tr><td>|F(x<sub>k</sub>)|</td><td class="reg-num" id="reg-nf">–</td></tr>
        <tr><td>|paso de Newton|</td><td class="reg-num" id="reg-ngn">–</td></tr>
        <tr><td>&rho; = real / predicha</td><td class="reg-num" id="reg-rho">–</td></tr>
      </table>
      <span class="reg-badge" id="reg-bd">listo para iterar</span>
      <div class="reg-ley" style="text-align:left;margin-top:0.5em" id="reg-hint"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const app=document.getElementById('reg-app'), svg=document.getElementById('reg-svg');
  const NS='http://www.w3.org/2000/svg', VB=640, VH=520;
  const el=i=>document.getElementById(i);

  // F(x,y) = ( 10(y - x^2), 1 - x ).  |F|^2 tiene un valle curvo y raiz en (1,1).
  const F=(x,y)=>[10*(y-x*x), 1-x];
  const Jm=(x,y)=>[[-20*x,10],[-1,0]];
  const phi=(x,y)=>{const f=F(x,y);return f[0]*f[0]+f[1]*f[1];};
  const RAIZ=[1,1], DMAX=6, ETA=0.1;

  const PRE={
    a:{nom:'(−1.2, 1.0)', x0:[-1.2,1.0], d0:0.5},
    b:{nom:'(−1.2, 1.0) Δ grande', x0:[-1.2,1.0], d0:3.0},
    c:{nom:'( 1.5, 2.0)', x0:[1.5,2.0], d0:1.0},
    d:{nom:'(−0.5, −0.4)', x0:[-0.5,-0.4], d0:2.0}
  };
  let key='a', S=null;

  function reset(x0,d0){
    const P=PRE[key];
    S={x:(x0||P.x0).slice(), d:(d0===undefined?P.d0:d0), k:0,
       cam:[(x0||P.x0).slice()], rho:null, ngn:null, p:null, acc:null,
       clip:false, fin:false};
    el('reg-d0').value=S.d; el('reg-d0v').textContent=S.d.toFixed(2);
  }

  // minimizador del modelo m(p)=|F+Jp|^2 dentro del disco de radio D
  function subproblema(){
    const [x,y]=S.x, f=F(x,y), j=Jm(x,y);
    const det=j[0][0]*j[1][1]-j[0][1]*j[1][0];
    let pgn;
    if(Math.abs(det)<1e-13) pgn=[-(j[0][0]*f[0]+j[1][0]*f[1]), -(j[0][1]*f[0]+j[1][1]*f[1])];
    else pgn=[(-f[0]*j[1][1]+f[1]*j[0][1])/det, (-j[0][0]*f[1]+j[1][0]*f[0])/det];
    const m=p=>{const a=f[0]+j[0][0]*p[0]+j[0][1]*p[1], b=f[1]+j[1][0]*p[0]+j[1][1]*p[1];
                return a*a+b*b;};
    const ngn=Math.hypot(pgn[0],pgn[1]);
    let p, clip=false;
    if(ngn<=S.d) p=pgn;
    else{
      clip=true; let mb=Infinity;
      for(let i=0;i<=720;i++){
        const t=2*Math.PI*i/720, q=[S.d*Math.cos(t), S.d*Math.sin(t)], v=m(q);
        if(v<mb){mb=v; p=q;}
      }
    }
    const pred=m([0,0])-m(p);
    const real=phi(x,y)-phi(x+p[0], y+p[1]);
    return {p:p, pgn:pgn, ngn:ngn, clip:clip, rho:pred>1e-300?real/pred:-1};
  }

  function iterar(){
    if(S.fin) return;
    if(Math.sqrt(phi(S.x[0],S.x[1]))<1e-8){S.fin=true; draw(); return;}
    const r=subproblema();
    S.p=r.p; S.ngn=r.ngn; S.clip=r.clip; S.rho=r.rho; S.acc=r.rho>ETA;
    if(r.rho<0.25)                    S.d=Math.max(S.d/2,1e-4);
    else if(r.rho>0.75 && r.clip)     S.d=Math.min(2*S.d,DMAX);
    if(S.acc){ S.x=[S.x[0]+r.p[0], S.x[1]+r.p[1]]; S.cam.push(S.x.slice()); S.k++; }
    draw();
  }

  const pdiv=el('reg-pres');
  Object.keys(PRE).forEach(k2=>{
    const b=document.createElement('button'); b.textContent=PRE[k2].nom; b.dataset.k=k2;
    b.onclick=()=>{key=k2; reset(); draw();}; pdiv.appendChild(b);
  });
  el('reg-it').onclick=()=>iterar();
  el('reg-it5').onclick=()=>{for(let i=0;i<5;i++) iterar();};
  el('reg-rs').onclick=()=>{reset(S.cam[0], +el('reg-d0').value); draw();};
  el('reg-d0').addEventListener('input',e=>{reset(S.cam[0], +e.target.value); draw();});

  function mk(t,at){const e=document.createElementNS(NS,t);for(const k2 in at)e.setAttribute(k2,at[k2]);return e;}

  // curvas de nivel por marching squares, una ruta por nivel
  function contorno(nivel,X,Y,x0,x1,y0,y1,N){
    let d='';
    const hx=(x1-x0)/N, hy=(y1-y0)/N;
    for(let i=0;i<N;i++) for(let j=0;j<N;j++){
      const xa=x0+i*hx, xb=xa+hx, ya=y0+j*hy, yb=ya+hy;
      const v=[phi(xa,ya),phi(xb,ya),phi(xb,yb),phi(xa,yb)];   // 0:BI 1:BD 2:SD 3:SI
      const pts=[];
      const cru=(p,q,va,vb,pa,pb)=>{
        if((va<nivel)===(vb<nivel)) return;
        const t=(nivel-va)/(vb-va);
        pts.push([pa[0]+t*(pb[0]-pa[0]), pa[1]+t*(pb[1]-pa[1])]);
      };
      cru(0,1,v[0],v[1],[xa,ya],[xb,ya]);
      cru(1,2,v[1],v[2],[xb,ya],[xb,yb]);
      cru(2,3,v[2],v[3],[xb,yb],[xa,yb]);
      cru(3,0,v[3],v[0],[xa,yb],[xa,ya]);
      for(let s=0;s+1<pts.length;s+=2)
        d+='M'+X(pts[s][0]).toFixed(1)+' '+Y(pts[s][1]).toFixed(1)+
           'L'+X(pts[s+1][0]).toFixed(1)+' '+Y(pts[s+1][1]).toFixed(1)+' ';
    }
    return d;
  }

  function draw(){
    const esc=VB/Math.max(svg.clientWidth||svg.getBoundingClientRect().width||VB,1);
    const fT=13*esc, fE=15*esc;
    const ml=Math.max(52,3.6*fT), mb=Math.max(42,3.2*fT), mt=16, mr=16;
    const W=VB-ml-mr, H=VH-mt-mb;

    // ventana isotropica: el radio de confianza debe verse como un circulo
    const cy=0.8, ry=1.75;                       // centro y semirango en y
    const rx=ry*(W/H);
    const x0=1-0.15-rx, x1=1-0.15+rx, y0=cy-ry, y1=cy+ry;
    const X=x=>ml+(x-x0)/(x1-x0)*W, Y=y=>mt+(y1-y)/(y1-y0)*H;
    const esc1=W/(x1-x0);                        // px por unidad (igual en los dos ejes)

    while(svg.firstChild) svg.removeChild(svg.firstChild);
    svg.appendChild(mk('rect',{x:ml,y:mt,width:W,height:H,fill:'#fff',stroke:'#d8dee4','stroke-width':1}));

    const NIV=[0.5,1.5,4.6,14,43,131,400];
    NIV.forEach((nv,i)=>{
      const d=contorno(nv,X,Y,x0,x1,y0,y1,72);
      svg.appendChild(mk('path',{d:d,fill:'none',stroke:'#9fb3c8',
        'stroke-width':0.9,opacity:0.35+0.45*(1-i/NIV.length)}));
    });

    for(let i=0;i<=4;i++){
      const xv=x0+(x1-x0)*i/4, yv=y0+(y1-y0)*i/4;
      let t=mk('text',{x:X(xv),y:mt+H+fT*1.25,'text-anchor':i===0?'start':(i===4?'end':'middle'),
        'font-size':fT,fill:'#5d6b78'}); t.textContent=xv.toFixed(1); svg.appendChild(t);
      t=mk('text',{x:ml-fT*0.5,y:Y(yv)+fT*0.36,'text-anchor':'end','font-size':fT,fill:'#5d6b78'});
      t.textContent=yv.toFixed(1); svg.appendChild(t);
    }
    let lx=mk('text',{x:ml+W/2,y:VH-mb*0.16,'text-anchor':'middle','font-size':fE,fill:'#1a2733'});
    lx.textContent='x'; svg.appendChild(lx);
    let ly=mk('text',{x:fE*0.85,y:mt+H/2,'text-anchor':'middle','font-size':fE,fill:'#1a2733',
      transform:'rotate(-90 '+(fE*0.85)+' '+(mt+H/2)+')'}); ly.textContent='y'; svg.appendChild(ly);

    // camino aceptado
    if(S.cam.length>1){
      let d='';
      S.cam.forEach((q,i)=>{d+=(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)+' ';});
      svg.appendChild(mk('path',{d:d,fill:'none',stroke:'#1a2733','stroke-width':2.2,opacity:0.85}));
      S.cam.slice(0,-1).forEach(q=>svg.appendChild(
        mk('circle',{cx:X(q[0]),cy:Y(q[1]),r:3.2,fill:'#1a2733',opacity:0.6})));
    }

    // raiz
    svg.appendChild(mk('circle',{cx:X(RAIZ[0]),cy:Y(RAIZ[1]),r:6.5,fill:'#1c7a3e',opacity:0.9}));

    // region de confianza
    svg.appendChild(mk('circle',{cx:X(S.x[0]),cy:Y(S.x[1]),r:S.d*esc1,fill:'#ff7f0e',
      'fill-opacity':0.07,stroke:'#ff7f0e','stroke-width':1.6,'stroke-dasharray':'6 4'}));

    // paso de Newton completo y paso propuesto
    const r0=subproblema();
    const gnx=S.x[0]+r0.pgn[0], gny=S.x[1]+r0.pgn[1];
    svg.appendChild(mk('line',{x1:X(S.x[0]),y1:Y(S.x[1]),x2:X(gnx),y2:Y(gny),
      stroke:'#1f77b4','stroke-width':1.8,'stroke-dasharray':'5 4',opacity:0.85}));
    svg.appendChild(mk('circle',{cx:X(gnx),cy:Y(gny),r:3.6,fill:'#1f77b4',opacity:0.85}));
    const px=S.x[0]+r0.p[0], py=S.x[1]+r0.p[1];
    svg.appendChild(mk('line',{x1:X(S.x[0]),y1:Y(S.x[1]),x2:X(px),y2:Y(py),
      stroke:'#d62728','stroke-width':2.6}));
    svg.appendChild(mk('circle',{cx:X(px),cy:Y(py),r:4.4,fill:'#fff',
      stroke:'#d62728','stroke-width':2}));

    // iterado actual
    svg.appendChild(mk('circle',{cx:X(S.x[0]),cy:Y(S.x[1]),r:5.8,fill:'#d62728',
      stroke:'#fff','stroke-width':1.6}));

    // clic para mover el punto de partida
    const hit=mk('rect',{x:ml,y:mt,width:W,height:H,fill:'transparent',style:'cursor:crosshair'});
    hit.addEventListener('pointerdown',ev=>{
      const rb=svg.getBoundingClientRect();
      const ux=x0+((ev.clientX-rb.left)*(VB/rb.width)-ml)/W*(x1-x0);
      const uy=y1-((ev.clientY-rb.top)*(VB/rb.width)-mt)/H*(y1-y0);
      reset([ux,uy], +el('reg-d0').value); draw();
    });
    svg.appendChild(hit);

    // panel
    const nf=Math.sqrt(phi(S.x[0],S.x[1]));
    el('reg-k').textContent=S.k;
    el('reg-d').textContent=S.d.toFixed(4);
    el('reg-nf').textContent=(nf>=1e-3&&nf<1e4)?nf.toPrecision(3):nf.toExponential(2).replace('e','e ');
    el('reg-ngn').textContent=r0.ngn.toFixed(3)+(r0.clip?'  (recortado)':'');
    el('reg-rho').textContent=S.rho===null?'–':S.rho.toFixed(3);
    el('reg-d0v').textContent=(+el('reg-d0').value).toFixed(2);
    [...pdiv.children].forEach(b=>b.classList.toggle('reg-on',b.dataset.k===key));

    const bd=el('reg-bd'), hint=el('reg-hint');
    if(nf<1e-8){ bd.textContent='convergió en '+S.k+' pasos'; bd.className='reg-badge reg-ok';
      hint.textContent='El paso de Newton ya es nulo.'; }
    else if(S.rho===null){ bd.textContent='listo para iterar'; bd.className='reg-badge reg-warn';
      hint.textContent='El paso de Newton mide '+r0.ngn.toFixed(2)+
        (r0.clip?', más que el radio: la región lo va a recortar.':', cabe dentro del radio.'); }
    else if(S.acc){ bd.textContent='paso aceptado'+(S.rho>0.75&&S.clip?' · región ×2':'');
      bd.className='reg-badge reg-ok';
      hint.textContent='La reducción real fue '+(S.rho*100).toFixed(0)+
        ' % de la predicha, así que el modelo sirve.'; }
    else { bd.textContent='paso rechazado · región ÷2'; bd.className='reg-badge reg-bad';
      hint.textContent='ρ = '+S.rho.toFixed(2)+': el modelo prometió una bajada que no ocurrió. '+
        'No nos movemos y achicamos el radio.'; }
  }

  let prevW=0;
  new ResizeObserver(e=>{
    const w=e[0].contentRect.width;
    if(Math.abs(w-prevW)<1) return;
    prevW=w;
    app.style.fontSize=Math.max(13,Math.min(17,w/50))+'px';
    draw();
  }).observe(app);

  reset(); draw();
})();
</script>
