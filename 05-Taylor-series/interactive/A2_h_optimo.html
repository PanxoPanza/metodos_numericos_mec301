<meta charset="utf-8">
<style>
#err-app{width:100%;max-width:min(800px,94vw);padding:4px 2px;background:transparent;
  font-family:"Segoe UI",Calibri,system-ui,sans-serif;font-size:15px;line-height:1.45;
  --tinta:#1a2733;--suave:#5d6b78;--linea:#d8dee4;--panel:#f6f8fa;
  --c1:#1f77b4;--c2:#ff7f0e;--rojo:#d62728;--acento:#00afd8;--verde:#1c7a3e;color:var(--tinta)}
#err-app *{box-sizing:border-box}
#err-app .err-wrap{display:flex;gap:1.05em;align-items:flex-start;flex-wrap:wrap}
#err-app .err-izq{flex:3 1 264px;min-width:0;max-width:448px}
#err-app .err-der{flex:2 1 250px;min-width:0;font-size:0.85em}
#err-app svg{width:100%;height:auto;display:block;background:#fff;
  border:1px solid var(--linea);border-radius:0.55em}
#err-app .err-ctrl{margin:0.5em 0}
#err-app .err-ctrl label{display:block;font-size:0.9em;color:var(--suave);margin-bottom:0.12em}
#err-app .err-val{color:var(--acento);font-weight:600}
#err-app input[type=range]{width:100%;margin:0;accent-color:var(--acento)}
#err-app .err-btns{display:grid;grid-template-columns:repeat(2,1fr);gap:0.3em;margin:0.35em 0 0.6em}
#err-app .err-btns button{font:inherit;font-size:0.86em;padding:0.3em 0.2em;cursor:pointer;
  border:1px solid var(--linea);border-radius:0.4em;background:#fff;color:var(--tinta)}
#err-app .err-btns button.err-on{background:var(--acento);border-color:var(--acento);color:#fff}
#err-app table.err-t{width:100%;border-collapse:collapse;margin-top:0.3em}
#err-app table.err-t td{padding:0.22em 0.3em;border-bottom:1px solid var(--linea)}
#err-app table.err-t td.err-num{text-align:right;font-variant-numeric:tabular-nums}
#err-app .err-badge{display:inline-block;padding:0.2em 0.6em;border-radius:1em;
  font-size:0.85em;font-weight:600;margin-top:0.5em}
#err-app .err-ok{background:#e3f4e8;color:var(--verde)}
#err-app .err-warn{background:#fdf3dd;color:#8a6100}
#err-app .err-bad{background:#fbe4e4;color:#a11}
#err-app .err-ley{font-size:0.82em;color:var(--suave);margin-top:0.35em;text-align:center}
#err-app .err-leg{display:flex;flex-wrap:wrap;justify-content:center;gap:0.3em 0.95em;
  margin-top:0.5em;font-size:0.84em;color:var(--tinta)}
#err-app .err-leg span{display:inline-flex;align-items:center;gap:0.42em;white-space:nowrap}
#err-app .err-sw{display:inline-block;width:2.2em;height:0}
#err-app .err-sw1{border-top:2.5px solid var(--tinta)}
#err-app .err-sw2{border-top:2px dashed var(--c2)}
#err-app .err-sw3{border-top:2px dashed var(--c1)}
#err-app .err-sw4{border-top:2px dashed var(--verde)}
</style>

<div id="err-app">
  <div class="err-wrap">
    <div class="err-izq">
      <svg id="err-svg" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="err-leg">
        <span><i class="err-sw err-sw1"></i>error total medido</span>
        <span><i class="err-sw err-sw2"></i>truncamiento &prop; h</span>
        <span><i class="err-sw err-sw3"></i>redondeo &prop; &epsilon;/h</span>
        <span><i class="err-sw err-sw4"></i>h &oacute;ptimo</span>
      </div>
      <div class="err-ley">Las rectas punteadas son las dos fuentes de error por separado.
        La curva negra es el error que realmente se mide.</div>
    </div>
    <div class="err-der">
      <div class="err-btns" id="err-fbtns"></div>
      <div class="err-ctrl">
        <label>paso &nbsp; h = <span class="err-val" id="err-hv">1e-8</span></label>
        <input type="range" id="err-h" min="-16" max="-1" step="0.1" value="-8">
      </div>
      <table class="err-t">
        <tr><td>f'(x) numérica</td><td class="err-num" id="err-num">–</td></tr>
        <tr><td>f'(x) exacta</td><td class="err-num" id="err-ex">–</td></tr>
        <tr><td>error total</td><td class="err-num" id="err-tot">–</td></tr>
        <tr><td>cifras correctas</td><td class="err-num" id="err-dig">–</td></tr>
      </table>
      <span class="err-badge" id="err-bd">–</span>
      <div class="err-ley" style="text-align:left;margin-top:0.5em" id="err-hint"></div>
    </div>
  </div>
</div>

<script>
(function(){
  const app=document.getElementById('err-app'), svg=document.getElementById('err-svg');
  const NS='http://www.w3.org/2000/svg', VB=640, VH=400;
  const EPS=Number.EPSILON;                       // 2.22e-16

  const FS={
    sin:{nom:'sin(x)',  f:Math.sin, d:Math.cos,        x0:1.0},
    exp:{nom:'e^x',     f:Math.exp, d:Math.exp,        x0:1.0},
    log:{nom:'ln(x)',   f:Math.log, d:x=>1/x,          x0:2.0},
    pol:{nom:'x³−2x',   f:x=>x*x*x-2*x, d:x=>3*x*x-2,  x0:1.5}
  };
  let key='sin', lh=-8;

  const el=i=>document.getElementById(i);
  const bdiv=el('err-fbtns');
  Object.keys(FS).forEach(k=>{
    const b=document.createElement('button'); b.textContent=FS[k].nom; b.dataset.k=k;
    b.onclick=()=>{key=k;draw();}; bdiv.appendChild(b);
  });

  // error medido de la diferencia adelantada
  function errTotal(h){
    const F=FS[key], x=F.x0;
    return Math.abs((F.f(x+h)-F.f(x))/h - F.d(x));
  }
  function mk(t,at){const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);return e;}

  let drag=false;

  function draw(){
    const F=FS[key], h=Math.pow(10,lh);
    const esc=VB/Math.max(svg.clientWidth||svg.getBoundingClientRect().width||VB,1);
    const fT=13*esc, fE=15*esc;
    const ml=Math.max(52,3.6*fT), mb=Math.max(42,3.2*fT), mt=16, mr=16;
    const W=VB-ml-mr, H=VH-mt-mb;
    const LX0=-17, LX1=0, LY0=-11, LY1=1;          // ejes en log10
    const X=l=>ml+(l-LX0)/(LX1-LX0)*W, Y=l=>mt+(LY1-l)/(LY1-LY0)*H;
    const iX=px=>LX0+(px-ml)/W*(LX1-LX0);
    const cl=l=>Math.min(Math.max(l,LY0-0.5),LY1+0.5);

    while(svg.firstChild) svg.removeChild(svg.firstChild);
    svg.appendChild(mk('rect',{x:ml,y:mt,width:W,height:H,fill:'#fff',stroke:'#d8dee4','stroke-width':1}));

    for(let e=LX0+1;e<=LX1;e+=4){
      svg.appendChild(mk('line',{x1:X(e),y1:mt,x2:X(e),y2:mt+H,stroke:'#eef1f4'}));
      const anc=e===LX0+1?'start':(e>=LX1?'end':'middle');
      const t=mk('text',{x:X(e),y:mt+H+fT*1.25,'text-anchor':anc,'font-size':fT,fill:'#5d6b78'});
      t.textContent='1e'+e; svg.appendChild(t);
    }
    for(let e=LY0;e<=LY1;e+=2){
      svg.appendChild(mk('line',{x1:ml,y1:Y(e),x2:ml+W,y2:Y(e),stroke:'#eef1f4'}));
      const t=mk('text',{x:ml-fT*0.5,y:Y(e)+fT*0.36,'text-anchor':'end','font-size':fT,fill:'#5d6b78'});
      t.textContent='1e'+e; svg.appendChild(t);
    }
    let lx=mk('text',{x:ml+W/2,y:VH-mb*0.16,'text-anchor':'middle','font-size':fE,fill:'#1a2733'});
    lx.textContent='paso h'; svg.appendChild(lx);
    let ly=mk('text',{x:fE*1.1,y:mt+H/2,'text-anchor':'middle','font-size':fE,fill:'#1a2733',
      transform:'rotate(-90 '+(fE*1.1)+' '+(mt+H/2)+')'});
    ly.textContent='error de f′(x)'; svg.appendChild(ly);

    // asintotas: truncamiento |f''|/2 * h   y   redondeo 2*eps*|f|/h
    const x=F.x0;
    const fpp=(F.f(x+1e-4)-2*F.f(x)+F.f(x-1e-4))/1e-8;
    const kT=Math.abs(fpp)/2, kR=2*EPS*Math.abs(F.f(x));
    let dT='',dR='',dE='';
    for(let i=0;i<=340;i++){
      const e=LX0+(LX1-LX0)*i/340;
      dT+=(i?'L':'M')+X(e).toFixed(1)+' '+Y(cl(Math.log10(kT)+e)).toFixed(1)+' ';
      dR+=(i?'L':'M')+X(e).toFixed(1)+' '+Y(cl(Math.log10(kR)-e)).toFixed(1)+' ';
    }
    for(let i=0;i<=340;i++){
      const e=LX0+(LX1-LX0)*i/340, er=errTotal(Math.pow(10,e));
      dE+=(i?'L':'M')+X(e).toFixed(1)+' '+Y(cl(er>0?Math.log10(er):LY0-1)).toFixed(1)+' ';
    }
    svg.appendChild(mk('path',{d:dT,fill:'none',stroke:'#ff7f0e','stroke-width':1.8,'stroke-dasharray':'6 4'}));
    svg.appendChild(mk('path',{d:dR,fill:'none',stroke:'#1f77b4','stroke-width':1.8,'stroke-dasharray':'6 4'}));
    svg.appendChild(mk('path',{d:dE,fill:'none',stroke:'#1a2733','stroke-width':2.4}));

    // h optimo teorico
    const lopt=0.5*Math.log10(kR/kT);
    svg.appendChild(mk('line',{x1:X(lopt),y1:mt,x2:X(lopt),y2:mt+H,
      stroke:'#1c7a3e','stroke-width':1.3,'stroke-dasharray':'4 4'}));
    const to=mk('text',{x:X(lopt),y:mt+fT*1.15,'text-anchor':'middle','font-size':fT,fill:'#1c7a3e'});
    to.textContent='h óptimo'; svg.appendChild(to);

    // marcador
    const er=errTotal(h);
    const ly2=er>0?Math.log10(er):LY0-1;
    svg.appendChild(mk('line',{x1:X(lh),y1:mt,x2:X(lh),y2:mt+H,stroke:'#00afd8','stroke-width':1.4}));
    svg.appendChild(mk('circle',{cx:X(lh),cy:Y(cl(ly2)),r:6.2,fill:'#00afd8',
      stroke:'#fff','stroke-width':1.6}));

    const hit=mk('rect',{x:ml,y:mt,width:W,height:H,fill:'transparent',style:'cursor:ew-resize'});
    const move=ev=>{const r=svg.getBoundingClientRect();
      const px=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)*(VB/r.width);
      lh=Math.min(Math.max(iX(px),-16),-1); el('err-h').value=lh; draw();};
    hit.addEventListener('pointerdown',e=>{drag=true;hit.setPointerCapture(e.pointerId);move(e);});
    hit.addEventListener('pointermove',e=>{if(drag)move(e);});
    hit.addEventListener('pointerup',()=>{drag=false;});
    hit.addEventListener('pointercancel',()=>{drag=false;});
    svg.appendChild(hit);

    const num=(F.f(x+h)-F.f(x))/h;
    el('err-hv').textContent=h.toExponential(1);
    el('err-num').textContent=num.toFixed(9);
    el('err-ex').textContent=F.d(x).toFixed(9);
    el('err-tot').textContent=er.toExponential(2);
    el('err-dig').textContent=er>0?Math.max(0,Math.round(-Math.log10(er/Math.abs(F.d(x))))):'16';
    [...bdiv.children].forEach(b=>b.classList.toggle('err-on',b.dataset.k===key));

    const bd=el('err-bd'), hint=el('err-hint');
    if(lh>lopt+1.2){ bd.textContent='domina el truncamiento'; bd.className='err-badge err-warn';
      hint.textContent='Bajar h todavía mejora el resultado.'; }
    else if(lh<lopt-1.2){ bd.textContent='domina el redondeo'; bd.className='err-badge err-bad';
      hint.textContent='Bajar h más empeora el resultado: la resta del numerador se cancela.'; }
    else { bd.textContent='cerca del paso óptimo'; bd.className='err-badge err-ok';
      hint.textContent='Acá las dos fuentes de error pesan lo mismo. Es lo mejor que da esta fórmula.'; }
  }

  el('err-h').addEventListener('input',e=>{lh=+e.target.value;draw();});

  let prevW=0;
  new ResizeObserver(en=>{
    const w=en[0].contentRect.width;
    if(Math.abs(w-prevW)<1) return;
    prevW=w;
    app.style.fontSize=Math.max(13,Math.min(17,w/50))+'px';
    draw();
  }).observe(app);

  draw();
})();
</script>
